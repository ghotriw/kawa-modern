name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Kawa
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Kawa (Universal)
        run: |
          xcodebuild -project kawa.xcodeproj \
            -scheme kawa \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build_output \
            build

      - name: Create Zip Archive
        run: |
          cd build_output/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Kawa Modern.app" Kawa-Modern.zip
          shasum -a 256 Kawa-Modern.zip > Kawa-Modern.zip.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kawa-Modern-Universal
          path: |
            build_output/Build/Products/Release/Kawa-Modern.zip
            build_output/Build/Products/Release/Kawa-Modern.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/Build/Products/Release/Kawa-Modern.zip
            build_output/Build/Products/Release/Kawa-Modern.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
